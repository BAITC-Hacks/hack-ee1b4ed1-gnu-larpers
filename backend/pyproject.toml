[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "money-graph"
version = "0.1.0"
description = "Explainable analysis of an incomplete bank transfer graph"
requires-python = ">=3.11,<3.15"
dependencies = [
  "networkx>=3.4,<4",
  "pandas>=2.2,<4",
  "pyarrow>=18,<24",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
agent = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "openai-agents>=0.3,<1",
]

[project.scripts]
money-graph = "money_graph.cli:main"
money-graph-server = "money_graph.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["money_graph"]
